[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scm-lightning"
version = "0.2.0"
description = "Argentina 13-14 December 2018 single-column microphysics and lightning"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.2", "xarray>=2024.1", "netCDF4>=1.6", "scipy>=1.10", "matplotlib>=3.8", "metpy>=1.7.1,<1.8", "requests>=2.31", "cdsapi>=0.7", "PyYAML>=6", "rasterio>=1.3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
scm-lightning = "scm_lightning.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
