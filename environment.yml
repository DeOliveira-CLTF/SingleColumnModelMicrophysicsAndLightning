name: scm-lightning
channels: [conda-forge]
dependencies:
  - python=3.12
  - numpy
  - pandas>=2.2
  - xarray
  - netcdf4
  - scipy
  - matplotlib
  - metpy=1.7.1
  - requests
  - cdsapi
  - pyyaml>=6
  - rasterio>=1.3
  - pytest
  - pip
  - pip:
      - -e .
# Build Fortran in Linux/WSL with gfortran and libnetcdff-dev.
